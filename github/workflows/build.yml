      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: Waqfa
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waqfa-APK
          path: Waqfa/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Waqfa/app/build/outputs/apk/debug/app-debug.apk Waqfa.apk
          gh release create "v${{ github.run_number }}" Waqfa.apk --repo "${{ github.repository }}" --title "Waqfa v${{ github.run_number }}" --notes "APK جاهز للتثبيت"
